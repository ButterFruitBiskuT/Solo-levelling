function home(m){const nx=nxt()[0];
m.innerHTML=`<section class="hero"><div class="rv"><div class="eyebrow">Solo Levelling</div><h1>Build Your Own<br>Advantage.</h1><p class="sub">A structured journey from Industrial Engineering to Business Intelligence, AI Automation, Quantitative Finance and Entrepreneurship.</p><a class="btn pri" href="#an">Open roadmap</a><a class="btn" href="#timeline">View timeline</a></div><div class="rv" style="--i:2">${geo()}</div></section>
<section class="stats rv" style="--i:3"><div><span class="k">Overall progress</span><b>${pct(N)}%</b></div><div><span class="k">Skills completed</span><b>${dn(N)} / ${N.length}</b></div><div>${nx?`<a href="#${nx.b}" onclick="sel='${nx.id}'"><span class="k">Recommended next</span><b>${nx.n} →</b></a>`:'<span class="k">Recommended next</span><b>All complete</b>'}</div></section>
<div class="sec"><span class="k">Six domains</span><span class="k">Select to open</span></div>
<div class="grid6">${K.map((k,i)=>{const l=N.filter(n=>n.b==k);return`<a class="cell rv" style="--c:${B[k][1]};--i:${i}" href="#${k}"><span class="no">0${i+1}</span><h3>${B[k][0]}</h3><p>${l.slice(0,3).map(n=>n.n.split(' (')[0]).join(' · ')}</p><div class="bar"><i style="width:${pct(l)}%"></i></div><div class="meta"><span>${dn(l)}/${l.length} skills · ${pct(l)}%</span><span class="arrow">→</span></div></a>`}).join('')}</div>
<div class="sec"><span class="k">The system</span></div><div class="flow"><span>Learn</span><span>Practise</span><span>Build</span><span>Document</span><span>Portfolio</span><span>Career / MBA</span><span>Business</span></div>
<p class="mu" style="max-width:640px;margin-top:20px">Python and statistics feed automation and trading. SQL feeds database work and conversion analysis. Prospecting feeds customer acquisition. CAT runs in parallel the whole way. Mini project first, always.</p>
<div class="sec"><span class="k">Post-MBA advantage</span></div><table><tr><th>Path</th><th>Most valuable skills</th></tr><tr><td>Consulting</td><td class="mu">Analytics, structured communication, pitching</td></tr><tr><td>Marketing / business development</td><td class="mu">Meta Ads, funnels, sales, negotiation</td></tr><tr><td>Product management</td><td class="mu">Automation, analytics, customer discovery</td></tr><tr><td>Finance</td><td class="mu">Financial analysis, quant, Python</td></tr><tr><td>Operations / strategy / general management</td><td class="mu">Operations research, forecasting, BI, pricing, leadership</td></tr><tr><td>Entrepreneurship</td><td class="mu">Automation, web, sales, financial literacy</td></tr></table>
<footer>Trading content is educational research, not financial advice. Verify IIM admission criteria on official sites. Progress saves in this browser.</footer>`}
function dom(m,k){const[nm,c]=B[k],l=N.filter(n=>n.b==k),i=K.indexOf(k),nx=nxt(k)[0],d={};
const dep=n=>d[n.id]??(d[n.id]=1+Math.max(0,...n.p.filter(q=>byId[q].b==k).map(q=>dep(byId[q]))));l.forEach(dep);
const mx=Math.max(...l.map(n=>d[n.id])),SG=['Stage 1 · Beginner','Stage 2 · Intermediate','Stage 3 · Advanced'],sg=n=>d[n.id]<=2?0:d[n.id]<=4?1:2;
const pj=PJ.map((q,j)=>[q,j]).filter(([q])=>q[1].split(',').some(x=>x.startsWith(k)));
const row=n=>`<details class="it ${lock(n)?'lk':''}" id="d-${n.id}" ${sel==n.id?'open':''}><summary><input type="checkbox" ${S[n.id]=='done'?'checked':''} ${lock(n)?'disabled':''} onclick="event.stopPropagation()" onchange="tg('${n.id}')"><span class="no">${NUM[n.id]}</span><span class="nm">${n.n}</span><span class="stt">${lab(n)}</span></summary><div class="bd"><span>Prerequisites: ${n.p.length?n.p.map(p=>`${byId[p].n.split(' (')[0]} <span class="no">${byId[p].b==k?NUM[p]:'0'+(K.indexOf(byId[p].b)+1)}</span>${S[p]=='done'?' ✓':''}`).join(', '):'none'}</span><div class="seg">${ST.map(([v,t])=>`<button class="${S[n.id]==v?'on':''}" ${lock(n)?'disabled':''} onclick="ss('${n.id}','${v}')">${t}</button>`).join('')}</div><a class="lnk" href="${n.r}" target="_blank" rel="noopener">Free resource ↗</a><span class="k">Start · month ${n.m}</span></div></details>`;
m.innerHTML=`<div class="dh rv"><div><span class="eyebrow">Domain 0${i+1} / 06</span><h2>${nm}</h2><div class="pn">${i>0?`<a href="#${K[i-1]}">← ${B[K[i-1]][0]}</a>`:''}${i<5?`<a href="#${K[i+1]}">${B[K[i+1]][0]} →</a>`:''}</div></div><div><div class="big" style="color:${c}">${pct(l)}%</div><div class="k">${dn(l)} of ${l.length} complete</div><div class="bar" style="margin-top:12px"><i style="width:${pct(l)}%"></i></div></div></div>
<div class="nxb rv" style="--i:1"><span class="k">Recommended next</span>${nx?`<a class="lnk" href="javascript:pk('${nx.id}')">${NUM[nx.id]} · ${nx.n}</a><span class="k">Month ${nx.m}</span>`:'<span>Domain complete</span>'}</div>
<div class="sec" style="margin-top:40px"><span class="k">Dependency tree</span><span class="k">Dim = locked · click a node</span></div>
<div class="tree" id="tr"><svg class="arr" id="sv"></svg>${Array.from({length:mx},(_,x)=>`<div class="col"><span class="k">Level ${x+1}</span>${l.filter(n=>d[n.id]==x+1).map(n=>`<div class="n ${lock(n)?'lock':S[n.id]||''} ${sel==n.id?'sel':''}" id="${n.id}" tabindex="0" role="button" onkeydown="if(event.key=='Enter'||event.key==' '){event.preventDefault();pk('${n.id}')}" onclick="pk('${n.id}')"><span class="no">${NUM[n.id]}</span><span class="nm">${n.n}</span></div>`).join('')}</div>`).join('')}</div>
${[0,1,2].map(s=>{const g=l.filter(n=>sg(n)==s);return g.length?`<details class="sg" id="sg${s}" open><summary><span class="k">${SG[s]}</span><span class="k">${dn(g)}/${g.length} · ${pct(g)}%</span></summary>${g.map(row).join('')}</details>`:''}).join('')}
${pj.length?`<div class="sec"><span class="k">Project milestones</span></div>${pj.map(([q,j])=>`<div class="pj"><input type="checkbox" ${PS[j]?'checked':''} onchange="tp(${j})"><div><h3>${q[0]}</h3><p>${q[6]}</p></div><div><p>${q[3]} · ${q[4]}</p></div></div>`).join('')}`:''}`;
m.insertAdjacentHTML('beforeend',DT[k]?tk(DT[k],0):'');m.style.setProperty('--c',c);lines(k);if(!window.stillFlag&&sel&&byId[sel].b==k)setTimeout(()=>{const e=document.getElementById('d-'+sel);e&&e.scrollIntoView({block:'center',behavior:'smooth'})},150)}
function lines(k){const t=$('#tr'),s=$('#sv');if(!t||!s)return;const tr=t.getBoundingClientRect(),P=(e,r)=>{const b=e.getBoundingClientRect();return[(r?b.right:b.left)-tr.left+t.scrollLeft,b.top+b.height/2-tr.top]};
s.setAttribute('width',t.scrollWidth);s.setAttribute('height',t.scrollHeight);
s.innerHTML='<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0L7,3.5L0,7z" fill="#777"/></marker></defs>'+N.filter(n=>n.b==k).flatMap(n=>n.p.filter(p=>byId[p].b==k).map(p=>{const[a,b]=P(document.getElementById(p),1),[c,e]=P(document.getElementById(n.id),0);return`<path d="M${a},${b}C${a+30},${b} ${c-30},${e} ${c-2},${e}" fill="none" stroke="${n.id==sel||p==sel?B[k][1]:S[p]=='done'?'#fff':'#444'}" stroke-width="1" marker-end="url(#ah)"/>`})).join('')}
function projects(m){m.innerHTML=`<div class="dh rv"><div><span class="eyebrow">Build / Document</span><h2>Eight projects.<br>One portfolio.</h2></div><div><div class="big">${PJ.filter((_,i)=>PS[i]).length}/8</div><div class="k">completed</div></div></div>${PJ.map((q,i)=>{const ids=q[1].split(',');return`<div class="pj rv" style="--i:${i}"><input type="checkbox" ${PS[i]?'checked':''} onchange="tp(${i})"><div><span class="no mu">0${i+1}</span><h3>${q[0]}</h3><p>${q[6]}</p><p><b>${dn(ids.map(x=>byId[x]).filter(Boolean))}/${ids.length}</b> required skills done</p></div><div><p><b>Skills</b> ${ids.map(x=>byId[x].n.split(' (')[0]).join(', ')}</p><p><b>Tools</b> ${q[2]}</p><p><b>Difficulty</b> ${q[3]} · <b>Time</b> ${q[4]}</p><p><b>Portfolio value</b> ${q[5]}</p></div></div>`}).join('')}`}
function timeline(m){m.innerHTML=`<div class="dh rv"><div><span class="eyebrow">Operating schedule</span><h2>First 90 days,<br>then eighteen months.</h2></div></div><div class="k">First 90 days · about 2.5 h/day: 1 h CAT, 1 h mini project, 30 min sales or speaking</div>${WK.map(w=>`<div class="tl"><span class="no">${w.split(':')[0]}</span><span>${w.split(': ')[1]}</span></div>`).join('')}<div class="sec"><span class="k">Monthly view</span><span class="k">Sales practice 3x/week throughout</span></div>${TL.map((t,i)=>`<div class="tl"><span class="no">M${String(i+1).padStart(2,'0')}</span><span>${t}${i==9?' <span class="k" style="color:#fff">· start approaching clients</span>':''}</span></div>`).join('')}`}
const SUM={cat:r=>{const a=r.slice(-3).map(x=>parseFloat(x[1])).filter(x=>!isNaN(x));return r.length+' mocks'+(a.length?' · last 3 avg '+(a.reduce((x,y)=>x+y)/a.length).toFixed(1):'')},sales:r=>r.length+' sessions · '+r.reduce((s,x)=>s+(parseFloat(x[1])||0),0)+' min',trade:r=>r.length+' entries',port:r=>r.length+' items'};
const TN={cat:'Mock every 2 weeks early on, weekly later. Analyse every mock.',sales:'Target three sessions a week: roleplay, cold call, pitch, negotiation.',trade:'Research only. Beat a simple benchmark after costs and test out-of-sample. Paper trade for months before real money.',port:'Document every project: problem, method, result, link.'};
const DT={sl:'sales',tr:'trade',mb:'cat'};
function tk(k,i){const[nm,f]=TK[k];return`<div class="rv"><div class="sec" style="margin-top:56px"><span class="k">${i?'0'+i+' · ':''}${nm}</span><span class="k">${SUM[k](LG[k]||[])}</span></div><p class="mu" style="margin:0">${TN[k]}</p><div class="fm">${f.map((x,j)=>`<input id="${k}${j}" placeholder="${x}">`).join('')}<button class="btn" onclick="ad('${k}')">Add</button></div><table>${(LG[k]||[]).map((r,j)=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}<td style="width:30px"><button class="x" onclick="rm('${k}',${j})" aria-label="Delete">×</button></td></tr>`).join('')}</table></div>`}
function trackers(m){m.innerHTML=`<div class="dh rv"><div><span class="eyebrow">Practice logs</span><h2>What gets logged,<br>gets better.</h2></div></div>`+Object.keys(TK).map((k,i)=>tk(k,i+1)).join('')}
function ad(k){const r=TK[k][1].map((_,i)=>document.getElementById(k+i).value.trim());if(!r[0])return;(LG[k]=LG[k]||[]).push(r);sv();route(1)}
function rm(k,i){LG[k].splice(i,1);sv();route(1)}
function route(still){const op=[...document.querySelectorAll('details[id][open]')].map(e=>e.id);$('#m').style.removeProperty('--c');window.stillFlag=!!still;const y=scrollY,h=location.hash.slice(1)||'home';
if(!still&&sel&&byId[sel].b!=h)sel=null;
document.body.classList.toggle('still',!!still);head();const m=$('#m');
(K.includes(h)?m=>dom(m,h):{home,projects,timeline,trackers}[h]||home)(m);
if(still){document.querySelectorAll('details[id]').forEach(e=>e.open=op.includes(e.id)||e.id=='d-'+sel);scrollTo(0,y)}else if(!sel)scrollTo(0,0)}
addEventListener('hashchange',()=>route());addEventListener('resize',()=>{const h=location.hash.slice(1);K.includes(h)&&lines(h)});
addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.fm input'))e.target.closest('.fm').querySelector('.btn').click()});
route();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
